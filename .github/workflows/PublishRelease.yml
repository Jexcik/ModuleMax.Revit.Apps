name: Publish Release

on:
  push:
    branches:
      - develop
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -e
          if git rev-parse "${{ github.event.inputs.version }}" >/dev/null 2>&1; then
            echo "Tag ${{ github.event.inputs.version }} already exists locally. Skipping creation."
          else
            git tag "${{ github.event.inputs.version }}"
          fi

          if git ls-remote --tags origin "refs/tags/${{ github.event.inputs.version }}" | grep -q "${{ github.event.inputs.version }}"; then
            echo "Tag ${{ github.event.inputs.version }} already exists on origin. Skipping push."
          else
            git push origin "${{ github.event.inputs.version }}"
          fi

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            "value=${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if ('${{ github.ref }}' -like 'refs/tags/*') {
            "value=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if ('${{ github.ref_name }}' -eq 'develop') {
            $baseVersion = Get-Content Changelog.md |
              Where-Object { $_ -match '^#\s+\d+\.\d+\.\d+' } |
              Select-Object -First 1 |
              ForEach-Object { ($_ -replace '^#\s+', '').Trim() }

            if (-not $baseVersion) {
              throw 'Unable to resolve base version from Changelog.md'
            }

            $date = Get-Date -Format 'yyMMdd'
            $version = "$baseVersion-alpha.${{ github.run_number }}.$date"
            "value=$version" >> $env:GITHUB_OUTPUT
            exit 0
          }

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}

      - name: Publish release
        if: steps.version.outputs.value != ''
        run: ./.nuke/build.cmd PublishGitHub --ReleaseVersion ${{ steps.version.outputs.value }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}